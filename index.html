<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Requerimientos</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background-color: #0b3c26; /* Color verde oscuro acorde al diseño */
      color: white;
      padding: 30px;
      border-radius: 8px;
      width: 95%;
      max-width: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .hidden { display: none !important; }
    
    /* MARCO 1: LOGIN */
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 30px 0;
    }
    
    /* MARCO 3: FORMULARIO USUARIO */
    .form-layout {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-top: 15px;
    }
    .left-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 14px;
    }
    
    textarea {
      height: 100%;
      min-height: 220px;
      resize: vertical;
    }

    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    button:hover { background-color: #2563eb; }

    /* MARCO 4: TABLA ADMIN */
    .table-container {
      background-color: white;
      color: #333;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      margin-top: 15px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background-color: #e5e7eb; color: #111; }
    tr:nth-child(even) { background-color: #f9fafb; }
    
    .prioridad-alta {
      color: #dc2626;
      font-weight: bold;
    }

    .prioridad-media {
      color: #d97706; /* Un tono amarillo/ámbar visible sobre fondo blanco */
      font-weight: bold;
    }

    .prioridad-baja {
      color: #16a34a;
      font-weight: bold;
    }

    input[type="text"],
    textarea,
    select {
    text-transform: uppercase;
    }
    
  </style>
</head>
<body>

  <!-- MARCO 1: INICIO DE SESIÓN -->
  <div id="marco1" class="card">
    <h2 style="text-align: center; margin-bottom: 10px;">Acceso al Sistema</h2>
    <p style="text-align: center; font-size: 14px; opacity: 0.9; margin-bottom: 20px;">
      Ingresa tu nombre completo para enviar un requerimiento o 'admin' para administrar.
    </p>
    <form id="loginForm" class="login-container">
      <input type="text" id="user" placeholder="Nombre Completo" required style="width: 280px;">
      
      <!-- Campo de contraseña (se muestra únicamente para admin) -->
      <div id="passwordContainer" class="hidden" style="width: 280px;">
        <input type="password" id="password" placeholder="Contraseña de Admin">
      </div>

      <button type="submit" id="btnIngresar">Ingresar</button>
    </form>
  </div>

  <!-- MARCO 3: REGISTRO DE REQUERIMIENTOS (USUARIO) -->
  <div id="marco3" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Registro de Requerimiento</h2>
      <div>
        <span id="saludoUsuario" style="margin-right: 15px; font-weight: bold; font-size: 14px;"></span>
        <button onclick="cerrarSesion()" style="background-color: #6b7280;">Cerrar Sesión</button>
      </div>
    </div>
    
    <form id="reqForm">
      <div class="form-layout">
        <div class="left-fields">
          <input type="text" id="solicitante" placeholder="Nombre del solicitante" required>
          <input type="text" id="unidad" placeholder="Unidad" required>
          <input type="text" id="localidad" placeholder="Localidad" required>
          <input type="text" id="jcu" placeholder="JCU" required>
          <input type="text" id="zona" placeholder="Zona" required>
          <select id="prioridad" required>
            <option value="">Seleccionar Prioridad</option>
            <option value="Alta">Alta</option>
            <option value="Media">Media</option>
            <option value="Baja">Baja</option>
          </select>
          <input type="text" id="area" placeholder="Área" required>
          <input type="number" step="0.01" id="costoAproximado" placeholder="Costo Aproximado ($)" required>
        </div>
        <div>
          <textarea id="concepto" placeholder="Concepto / Descripción del requerimiento..." required></textarea>
        </div>
      </div>
      <div style="text-align: center; margin-top: 20px;">
        <button type="submit">Enviar</button>
      </div>
    </form>
  </div>

  <!-- MARCO 4: TABLA DE ADMINISTRACIÓN -->
  <div id="marco4" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Panel de Administración</h2>
      <div>
        <button onclick="cargarTabla()">Actualizar Tabla</button>
        <button onclick="cerrarSesion()" style="background-color: #6b7280;">Cerrar Sesión</button>
      </div>
    </div>
    
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Solicitante</th>
            <th>Unidad</th>
            <th>Localidad</th>
            <th>JCU</th>
            <th>Zona</th>
            <th>Prioridad</th>
            <th>Área</th>
            <th>Costo Aprox.</th>
            <th>Concepto</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaBody">
          <tr><td colspan="8" style="text-align: center;">Cargando registros...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. CONFIGURACIÓN DE SUPABASE
    const SUPABASE_URL = "https://hvimndiwntssnlbotylk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_nsnGCqO3CXUKr9uJKyzgpg_6_8Pnkgf";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let nombreUsuarioActual = "";

    // Detección para mostrar contraseña únicamente si el usuario es "admin"
  document.getElementById('user').addEventListener('input', function(e) {
  const valor = e.target.value.trim().toLowerCase();
  const pwdContainer = document.getElementById('passwordContainer');
  const pwdInput = document.getElementById('password');

  // Si contiene un correo (@) o empieza con 'admin'
  if (valor.includes('@') || valor.startsWith('admin')) {
    pwdContainer.classList.remove('hidden');
  } else {
    pwdContainer.classList.add('hidden');
    pwdInput.value = ''; 
  }
});

    // 2. NAVEGACIÓN ENTRE MARCOS
    function mostrarMarco(marcoId) {
      document.getElementById('marco1').classList.add('hidden');
      document.getElementById('marco3').classList.add('hidden');
      document.getElementById('marco4').classList.add('hidden');
      
      document.getElementById(marcoId).classList.remove('hidden');
    }

    function cerrarSesion() {
      nombreUsuarioActual = "";
      document.getElementById('loginForm').reset();
      document.getElementById('passwordContainer').classList.add('hidden');
      mostrarMarco('marco1');
    }

    // 3. EVENTO DE ACCESO (MARCO 1)
    // EVENTO DE ACCESO (MARCO 1)
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const userInput = document.getElementById('user').value.trim();
  const passwordInput = document.getElementById('password').value.trim();

  // Intentar iniciar sesión en Supabase Auth con los datos introducidos por el usuario
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: userInput,
    password: passwordInput
  });

  if (passwordInput !== '') {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: userInput,
      password: passwordInput
    });

    if (error) {
      alert("Error al iniciar sesión: " + error.message);
    } else {
      // Al autenticar exitosamente, Supabase otorga los permisos 'authenticated'
      mostrarMarco('marco4');
      cargarTabla();
    }
  } else {
    // Si no hay contraseña, entra como usuario normal a registrar datos
    nombreUsuarioActual = userInput;
    document.getElementById('saludoUsuario').innerText = "Usuario: " + nombreUsuarioActual.toUpperCase();
    document.getElementById('solicitante').value = nombreUsuarioActual;
    mostrarMarco('marco3');
  }
});

    // 4. GUARDAR REGISTRO (MARCO 3 -> SUPABASE)
    document.getElementById('reqForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const nuevoRegistro = {
        solicitante: document.getElementById('solicitante').value.trim().toUpperCase(),
        unidad: document.getElementById('unidad').value.trim().toUpperCase(),
        localidad: document.getElementById('localidad').value.trim().toUpperCase(),
        jcu: document.getElementById('jcu').value.trim().toUpperCase(),
        zona: document.getElementById('zona').value.trim().toUpperCase(),
        prioridad: document.getElementById('prioridad').value.trim().toUpperCase(),
        area: document.getElementById('area').value.trim().toUpperCase(),
        costo_aproximado: parseFloat(document.getElementById('costoAproximado').value) || 0,
        concepto: document.getElementById('concepto').value.trim().toUpperCase()
      };

      const { data, error } = await supabaseClient
        .from('requerimientos')
        .insert([nuevoRegistro]);

      if (error) {
        alert("Error al guardar: " + error.message);
      } else {
        alert("¡Requerimiento guardado exitosamente!");
        document.getElementById('reqForm').reset();
      }
    });

    function obtenerClasePrioridad(prioridad) {
    if (!prioridad) return '';
    const prio = prioridad.toString().trim().toLowerCase();
    
    if (prio === 'alta') return 'prioridad-alta';
    if (prio === 'media') return 'prioridad-media';
    if (prio === 'baja') return 'prioridad-baja';
    
    return '';
    }

    async function eliminarRequerimiento(id) {
      const confirmacion = confirm(`¿Eliminar requerimiento ${id}?`);

      if(!confirmacion) return;

        const {error} = await supabaseClient
        .from('requerimientos')
        .delete()
        .eq('id', id);

      if(error){
        alert("Error al eliminar el registro: "+ error.message);
      }else{
        cargarTabla();
      }


    }
    // 5. CARGAR REGISTROS EN TABLA (MARCO 4)
    async function cargarTabla() {
      const tbody = document.getElementById('tablaBody');
      tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Cargando registros...</td></tr>';

      const { data, error } = await supabaseClient
        .from('requerimientos')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        alert("Error al cargar la tabla: " + error.message);
        return;
      }

      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No hay registros guardados.</td></tr>';
        return;
      }

      data.forEach(item => {
        const tr = document.createElement('tr');
        const clasePrioridad = obtenerClasePrioridad(item.prioridad);
        const costoFormateado = item.costo_aproximado ? '$' + Number(item.costo_aproximado).toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits:2}): '-';
        tr.innerHTML = `
          <td>${item.id}</td>
          <td>${item.solicitante || '-'}</td>
          <td>${item.unidad || '-'}</td>
          <td>${item.localidad || '-'}</td>
          <td>${item.jcu || '-'}</td>
          <td>${item.zona || '-'}</td>
          <td class="${clasePrioridad}"> ${item.prioridad || '-'}</td>
          <td>${item.area || '-'}</td>
          <td>${costoFormateado}</td>
          <td>${item.concepto || '-'}</td>
          <td style="text-aling: center;">
            <button onclick ="eliminarRequerimiento(${item.id})" style="background-color: #ef4444; padding: 6px 12 px; front-size 12px;">
                eliminar
                </button>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
